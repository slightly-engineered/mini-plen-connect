<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RoBoHoN Control</title>
  <!-- ?v= forces phones to fetch the new file after each update -->
  <link rel="stylesheet" href="style.css?v=3" />
</head>
<body>

  <main class="icon-grid">

    <!-- Row 1 -->
    <button class="icon-btn" data-slot="1">
      <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
      <div class="icon-label">Forward</div>
    </button>

    <button class="icon-btn" data-slot="2">
      <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M7 7h10v10"/></svg>
      <div class="icon-label">Right Fwd</div>
    </button>

    <button class="icon-btn" data-slot="3">
      <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      <div class="icon-label">Right</div>
    </button>

    <!-- Row 2: upload a motion file to the chosen slot, or play that slot -->
    <button id="uploadMotion" class="icon-btn">
      <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5"/><path d="M12 3v12"/></svg>
      <div class="icon-label">Upload</div>
    </button>

    <label class="icon-btn slot-btn">
      <div class="slot-value" id="slotLabel">1</div>
      <div class="icon-label">Slot</div>
      <select id="motionSlot" aria-label="Motion slot">
        <option value="1">Slot 1</option>
        <option value="2">Slot 2</option>
        <option value="3">Slot 3</option>
        <option value="4">Slot 4</option>
        <option value="5">Slot 5</option>
        <option value="6">Slot 6</option>
        <option value="7">Slot 7</option>
        <option value="8">Slot 8</option>
        <option value="70">70 Walk Forward</option>
        <option value="71">71 Walk Left Turn</option>
        <option value="72">72 Walk Right Turn</option>
        <option value="73">73 Walk Back</option>
      </select>
    </label>

    <button id="playSlot" class="icon-btn">
      <svg class="icon-svg" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M7 4l13 8-13 8z"/></svg>
      <div class="icon-label">Play</div>
    </button>

    <input type="file" id="motionFile" accept=".json,application/json" hidden>

  </main>

  <div id="statusLine"></div>

  <!-- Walk joystick: up/down = walk forward/back, left/right = turn.
       Style from the pan-tilt tripod page (ptz_firmware/webpage.h) -->
  <section class="joy-panel">
    <div id="joyArea">
      <div id="stick"></div>
    </div>
  </section>

  <footer class="bottom-bar">
    <button id="connect" class="footer-btn">
      Connect <span id="statusDot" class="dot gray"></span>
    </button>
    <button id="advanced" class="footer-btn">Advanced</button>
  </footer>

  <pre id="log"></pre>

  <script type="module" src="app.js?v=3"></script>
</body>
</html>
